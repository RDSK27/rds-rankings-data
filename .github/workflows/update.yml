name: Actualizar rankings

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leer lo nuevo de Firestore
        run: node generate.js
      - name: Publicar si hay cambios
        run: |
          git config user.name "rds-rankings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
